set_oid:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: apc_rack_power
    oid:
      required: true
      selector:
        text:
    value:
      required: true
      selector:
        number:
          mode: box

control_action:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: apc_rack_power
    control_uid:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        select:
          options:
            - "on"
            - "off"
            - "cycle"
